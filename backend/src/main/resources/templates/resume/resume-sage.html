<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${(not #strings.isEmpty(resume.personalInfo.fullName()) ? resume.personalInfo.fullName() : 'Resume') + ' - ResumeForge'}">Resume</title>
  <style th:utext="${css}"></style>
</head>
<body style="margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #ffffff;">
  <table class="layout-table" style="width: 100%; border-collapse: collapse; height: 100%; min-height: 297mm;">
    <tr>
      <!-- LEFT LIGHT GRAY SIDEBAR -->
      <td style="width: 32%; vertical-align: top; background-color: #f3f4f6; color: #1f2937; padding: 20pt 14pt;">
        <!-- Circular Avatar -->
        <div style="text-align: center; margin-bottom: 14pt;">
          <img th:if="${not #strings.isEmpty(resume.personalInfo.photoUrl())}"
               th:src="${resume.personalInfo.photoUrl()}"
               alt="Photo"
               style="width: 55pt; height: 55pt; border-radius: 50%; object-fit: cover; display: inline-block; border: 2pt solid #4a7048;"/>
          <div th:if="${#strings.isEmpty(resume.personalInfo.photoUrl())}"
               style="width: 55pt; height: 55pt; border-radius: 50%; background-color: #dcfce7; border: 2pt solid #4a7048; display: inline-block; line-height: 55pt; font-size: 20pt; font-weight: bold; color: #166534;"
               th:text="${not #strings.isEmpty(resume.personalInfo.fullName()) ? #strings.substring(resume.personalInfo.fullName(), 0, 1) : 'P'}">P</div>
        </div>

        <!-- Contact Section with Sage Badges -->
        <div class="section" style="margin-bottom: 14pt;">
          <div th:if="${not #strings.isEmpty(resume.personalInfo.location())}" style="margin-bottom: 5pt; font-size: 8pt; color: #374151;">
            <span style="background-color: #4a7048; color: #ffffff; border-radius: 50%; width: 13pt; height: 13pt; display: inline-block; text-align: center; line-height: 13pt; font-size: 7pt; margin-right: 4pt;">&#9873;</span>
            <span th:text="${resume.personalInfo.location()}">Location</span>
          </div>
          <div th:if="${not #strings.isEmpty(resume.personalInfo.phone())}" style="margin-bottom: 5pt; font-size: 8pt; color: #374151;">
            <span style="background-color: #4a7048; color: #ffffff; border-radius: 50%; width: 13pt; height: 13pt; display: inline-block; text-align: center; line-height: 13pt; font-size: 7pt; margin-right: 4pt;">&#9742;</span>
            <span th:text="${resume.personalInfo.phone()}">Phone</span>
          </div>
          <div th:if="${not #strings.isEmpty(resume.personalInfo.email())}" style="margin-bottom: 5pt; font-size: 8pt; color: #374151;">
            <span style="background-color: #4a7048; color: #ffffff; border-radius: 50%; width: 13pt; height: 13pt; display: inline-block; text-align: center; line-height: 13pt; font-size: 7pt; margin-right: 4pt;">&#9993;</span>
            <span th:text="${resume.personalInfo.email()}">Email</span>
          </div>
          <div th:if="${not #strings.isEmpty(resume.personalInfo.linkedin())}" style="margin-bottom: 5pt; font-size: 8pt; color: #374151;">
            <span style="background-color: #4a7048; color: #ffffff; border-radius: 50%; width: 13pt; height: 13pt; display: inline-block; text-align: center; line-height: 13pt; font-size: 7pt; font-weight: bold; margin-right: 4pt;">in</span>
            <span th:text="${resume.personalInfo.linkedin()}">LinkedIn</span>
          </div>
          <div th:if="${#strings.isEmpty(resume.personalInfo.email()) and #strings.isEmpty(resume.personalInfo.phone()) and #strings.isEmpty(resume.personalInfo.location())}" style="color: #94a3b8; font-style: italic; font-size: 8pt;">
            <span style="background-color: #4a7048; color: #ffffff; border-radius: 50%; width: 13pt; height: 13pt; display: inline-block; text-align: center; line-height: 13pt; font-size: 7pt; margin-right: 4pt;">&#9993;</span>
            priya.raman@example.com
          </div>
        </div>

        <!-- Key Skills with Sage Green Tab Banner -->
        <div class="section" style="margin-bottom: 14pt;" th:if="${not #lists.isEmpty(resume.skills)}">
          <div style="background-color: #4a7048; color: #ffffff; padding: 3pt 8pt; font-size: 8.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5pt; border-radius: 0 5pt 5pt 0; margin-left: -14pt; padding-left: 14pt; margin-bottom: 6pt;">
            KEY SKILLS
          </div>
          <ul class="bullets" style="margin: 0; padding-left: 12pt; color: #374151; line-height: 1.5;">
            <li th:each="s : ${resume.skills}" th:text="${s}" style="font-size: 8pt; margin-bottom: 2.5pt;">Skill</li>
          </ul>
        </div>

        <!-- Certifications -->
        <div class="section" style="margin-bottom: 12pt;" th:if="${not #lists.isEmpty(resume.certifications)}">
          <div style="background-color: #4a7048; color: #ffffff; padding: 3pt 8pt; font-size: 8.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5pt; border-radius: 0 5pt 5pt 0; margin-left: -14pt; padding-left: 14pt; margin-bottom: 6pt;">
            CERTIFICATIONS
          </div>
          <ul class="bullets" style="margin: 0; padding-left: 12pt; color: #374151; line-height: 1.45;">
            <li th:each="c : ${resume.certifications}" th:text="${c}" style="font-size: 8pt; margin-bottom: 2.5pt;">Cert</li>
          </ul>
        </div>
      </td>

      <!-- RIGHT WHITE MAIN COLUMN -->
      <td style="width: 68%; vertical-align: top; padding: 20pt 20pt;">
        <!-- Header Name & Title -->
        <div style="margin-bottom: 12pt;">
          <h1 style="font-size: 24pt; font-weight: 800; text-transform: uppercase; margin: 0 0 2pt 0; letter-spacing: 1.5pt; color: #166534;"
              th:text="${not #strings.isEmpty(resume.personalInfo.fullName()) ? resume.personalInfo.fullName() : 'PRIYA RAMANATHAN'}">PRIYA RAMANATHAN</h1>
          <p th:if="${not #strings.isEmpty(resume.personalInfo.headline())}"
             th:text="${resume.personalInfo.headline()}"
             style="font-size: 10pt; text-transform: uppercase; letter-spacing: 1pt; color: #4b5563; margin: 0 0 6pt 0; font-weight: 600;">Marketing Executive</p>
          <div style="border-top: 2pt solid #bbf7d0; margin-bottom: 8pt;"></div>
          <p style="color: #4b5563; font-size: 8.5pt; line-height: 1.45; margin: 0;"
             th:if="${not #strings.isEmpty(resume.summary)}"
             th:text="${resume.summary}">Profile summary...</p>
        </div>

        <!-- Work Experience -->
        <div class="section" style="margin-bottom: 12pt;" th:if="${not #lists.isEmpty(resume.experience)}">
          <div style="background-color: #dcfce7; color: #166534; padding: 2.5pt 8pt; font-size: 9.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5pt; border-radius: 2pt; margin-bottom: 8pt;">
            WORK EXPERIENCE
          </div>
          <div class="entry" th:each="e : ${resume.experience}" style="margin-bottom: 9pt;">
            <p style="font-size: 9.5pt; font-weight: 700; color: #14532d; margin: 0;" th:text="${e.role()}">Role</p>
            <p style="font-size: 8.5pt; color: #374151; font-weight: 600; margin: 1pt 0;" th:text="${e.company()}">Company</p>
            <p style="font-size: 8pt; color: #6b7280; margin: 0 0 3pt 0;"
               th:text="${#strings.defaultString(e.startDate(),'')} + ' - ' + (${e.current()} ? 'Present' : ${#strings.defaultString(e.endDate(),'')})">Dates</p>
            <ul class="bullets" th:if="${not #lists.isEmpty(e.bullets())}" style="margin: 0; padding-left: 12pt; color: #374151; line-height: 1.38;">
              <li th:each="b : ${e.bullets()}" th:text="${b}" style="font-size: 8.5pt; margin-bottom: 1.8pt;">bullet</li>
            </ul>
          </div>
        </div>

        <!-- Education -->
        <div class="section" style="margin-bottom: 12pt;" th:if="${not #lists.isEmpty(resume.education)}">
          <div style="background-color: #dcfce7; color: #166534; padding: 2.5pt 8pt; font-size: 9.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5pt; border-radius: 2pt; margin-bottom: 7pt;">
            EDUCATION
          </div>
          <div class="entry" th:each="e : ${resume.education}" style="margin-bottom: 7pt;">
            <p style="font-size: 9pt; font-weight: 700; color: #14532d; margin: 0;"
               th:text="${e.degree() + (e.field() != null ? ' in ' + e.field() : '')}">Degree</p>
            <p style="font-size: 8.5pt; color: #374151; margin: 1pt 0 0 0;" th:text="${e.institution()}">Institution</p>
            <p style="font-size: 8pt; color: #6b7280; margin: 0;"
               th:text="${#strings.defaultString(e.startDate(),'')} + ' - ' + ${#strings.defaultString(e.endDate(),'')}">Dates</p>
          </div>
        </div>

        <!-- Projects -->
        <div class="section" style="margin-bottom: 10pt;" th:if="${not #lists.isEmpty(resume.projects)}">
          <div style="background-color: #dcfce7; color: #166534; padding: 2.5pt 8pt; font-size: 9.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5pt; border-radius: 2pt; margin-bottom: 7pt;">
            PROJECTS
          </div>
          <div class="entry" th:each="p : ${resume.projects}" style="margin-bottom: 7pt;">
            <p style="font-size: 9pt; font-weight: 700; color: #14532d; margin: 0;" th:text="${p.name()}">Project</p>
            <p style="font-size: 8pt; color: #166534; margin: 1pt 0 2pt 0;" th:if="${not #strings.isEmpty(p.techStack())}" th:text="${p.techStack()}">Tech</p>
            <ul class="bullets" th:if="${not #lists.isEmpty(p.bullets())}" style="margin: 0; padding-left: 12pt; color: #374151; line-height: 1.35;">
              <li th:each="b : ${p.bullets()}" th:text="${b}" style="font-size: 8.5pt; margin-bottom: 1.5pt;">bullet</li>
            </ul>
          </div>
        </div>
      </td>
    </tr>
  </table>
</body>
</html>
