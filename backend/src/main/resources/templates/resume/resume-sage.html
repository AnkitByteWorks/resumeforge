<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${resume.personalInfo.fullName()} + ' - Resume'">Resume</title>
  <style th:utext="${css}"></style>
</head>
<body style="margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #ffffff;">
  <table style="width: 100%; border-collapse: collapse; min-height: 100%;">
    <tr>
      <!-- LEFT LIGHT GRAY SIDEBAR -->
      <td style="width: 32%; vertical-align: top; background-color: #f3f4f6; color: #1f2937; padding: 22pt 16pt;">
        <!-- Circular Avatar -->
        <div style="text-align: center; margin-bottom: 18pt;">
          <img th:if="${not #strings.isEmpty(resume.personalInfo.photoUrl())}"
               th:src="${resume.personalInfo.photoUrl()}"
               alt="Photo"
               style="width: 85pt; height: 85pt; border-radius: 50%; object-fit: cover; display: inline-block; border: 2pt solid #4a7048;"/>
          <div th:if="${#strings.isEmpty(resume.personalInfo.photoUrl())}"
               style="width: 85pt; height: 85pt; border-radius: 50%; background-color: #dcfce7; border: 2pt solid #4a7048; display: inline-block; line-height: 85pt; font-size: 26pt; font-weight: bold; color: #166534;"
               th:text="${#strings.substring(resume.personalInfo.fullName(), 0, 1)}">P</div>
        </div>

        <!-- Contact Section with Sage Badges -->
        <div style="margin-bottom: 18pt;">
          <div th:if="${not #strings.isEmpty(resume.personalInfo.location())}" style="margin-bottom: 6pt; font-size: 8pt; color: #374151;">
            <span style="background-color: #4a7048; color: #ffffff; border-radius: 50%; width: 14pt; height: 14pt; display: inline-block; text-align: center; line-height: 14pt; font-size: 7.5pt; margin-right: 4pt;">📍</span>
            <span th:text="${resume.personalInfo.location()}">Location</span>
          </div>
          <div th:if="${not #strings.isEmpty(resume.personalInfo.phone())}" style="margin-bottom: 6pt; font-size: 8pt; color: #374151;">
            <span style="background-color: #4a7048; color: #ffffff; border-radius: 50%; width: 14pt; height: 14pt; display: inline-block; text-align: center; line-height: 14pt; font-size: 7.5pt; margin-right: 4pt;">📞</span>
            <span th:text="${resume.personalInfo.phone()}">Phone</span>
          </div>
          <div th:if="${not #strings.isEmpty(resume.personalInfo.email())}" style="margin-bottom: 6pt; font-size: 8pt; color: #374151;">
            <span style="background-color: #4a7048; color: #ffffff; border-radius: 50%; width: 14pt; height: 14pt; display: inline-block; text-align: center; line-height: 14pt; font-size: 7.5pt; margin-right: 4pt;">✉</span>
            <span th:text="${resume.personalInfo.email()}">Email</span>
          </div>
          <div th:if="${not #strings.isEmpty(resume.personalInfo.linkedin())}" style="margin-bottom: 6pt; font-size: 8pt; color: #374151;">
            <span style="background-color: #4a7048; color: #ffffff; border-radius: 50%; width: 14pt; height: 14pt; display: inline-block; text-align: center; line-height: 14pt; font-size: 7.5pt; margin-right: 4pt;">in</span>
            <span th:text="${resume.personalInfo.linkedin()}">LinkedIn</span>
          </div>
        </div>

        <!-- Key Skills with Sage Green Tab Banner -->
        <div style="margin-bottom: 18pt;" th:if="${not #lists.isEmpty(resume.skills)}">
          <div style="background-color: #4a7048; color: #ffffff; padding: 3pt 8pt; font-size: 8.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5pt; border-radius: 0 6pt 6pt 0; margin-left: -16pt; padding-left: 16pt; margin-bottom: 8pt;">
            KEY SKILLS
          </div>
          <ul style="margin: 0; padding-left: 12pt; font-size: 8pt; color: #374151; line-height: 1.55;">
            <li th:each="s : ${resume.skills}" th:text="${s}" style="margin-bottom: 3pt;">Skill</li>
          </ul>
        </div>

        <!-- Certifications -->
        <div style="margin-bottom: 16pt;" th:if="${not #lists.isEmpty(resume.certifications)}">
          <div style="background-color: #4a7048; color: #ffffff; padding: 3pt 8pt; font-size: 8.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5pt; border-radius: 0 6pt 6pt 0; margin-left: -16pt; padding-left: 16pt; margin-bottom: 8pt;">
            CERTIFICATIONS
          </div>
          <ul style="margin: 0; padding-left: 12pt; font-size: 8pt; color: #374151; line-height: 1.5;">
            <li th:each="c : ${resume.certifications}" th:text="${c}" style="margin-bottom: 3pt;">Cert</li>
          </ul>
        </div>
      </td>

      <!-- RIGHT WHITE MAIN COLUMN -->
      <td style="width: 68%; vertical-align: top; padding: 22pt 24pt;">
        <!-- Centered Name & Summary -->
        <div style="text-align: center; margin-bottom: 16pt;">
          <h1 style="font-size: 24pt; font-weight: 800; text-transform: uppercase; letter-spacing: 2pt; margin: 0 0 2pt 0; color: #0f172a;"
              th:text="${resume.personalInfo.fullName()}">PRIYA RAMANATHAN</h1>
          <p th:if="${not #strings.isEmpty(resume.personalInfo.headline())}"
             th:text="${resume.personalInfo.headline()}"
             style="font-size: 10pt; color: #4a7048; font-weight: 600; margin: 0 0 8pt 0;">Senior Associate</p>
          <p th:if="${not #strings.isEmpty(resume.summary)}"
             th:text="${resume.summary}"
             style="font-size: 8.5pt; line-height: 1.45; color: #374151; margin: 0; text-align: left;">Commercial litigator summary...</p>
        </div>

        <!-- Professional Experience with Sage Banner Bar -->
        <div style="margin-bottom: 16pt;" th:if="${not #lists.isEmpty(resume.experience)}">
          <div style="background-color: #4a7048; color: #ffffff; padding: 3.5pt 8pt; border-radius: 3pt; font-size: 8.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5pt; margin-bottom: 8pt;">
            PROFESSIONAL EXPERIENCE
          </div>
          <div th:each="e : ${resume.experience}" style="margin-bottom: 10pt;">
            <p style="font-size: 9.5pt; font-weight: 700; color: #0f172a; margin: 0;" th:text="${e.role()}">Role</p>
            <p style="font-size: 8pt; color: #4a7048; font-weight: 600; margin: 1pt 0 3pt 0;"
               th:text="${e.company()} + ' | ' + ${#strings.defaultString(e.startDate(),'')} + ' - ' + (${e.current()} ? 'PRESENT' : ${#strings.defaultString(e.endDate(),'')})">Company | Dates</p>
            <ul th:if="${not #lists.isEmpty(e.bullets())}" style="margin: 0; padding-left: 12pt; font-size: 8pt; color: #374151; line-height: 1.4;">
              <li th:each="b : ${e.bullets()}" th:text="${b}" style="margin-bottom: 2pt;">bullet</li>
            </ul>
          </div>
        </div>

        <!-- Education with Sage Banner Bar -->
        <div style="margin-bottom: 16pt;" th:if="${not #lists.isEmpty(resume.education)}">
          <div style="background-color: #4a7048; color: #ffffff; padding: 3.5pt 8pt; border-radius: 3pt; font-size: 8.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5pt; margin-bottom: 8pt;">
            EDUCATION
          </div>
          <div th:each="e : ${resume.education}" style="margin-bottom: 8pt;">
            <p style="font-size: 9pt; font-weight: 700; color: #0f172a; margin: 0;"
               th:text="${e.degree() + (e.field() != null ? ' in ' + e.field() : '')}">Degree</p>
            <p style="font-size: 8pt; color: #52525b; margin: 1pt 0;"
               th:text="${e.institution()} + ' | ' + ${#strings.defaultString(e.startDate(),'')} + ' - ' + ${#strings.defaultString(e.endDate(),'')}">School | Dates</p>
          </div>
        </div>

        <!-- Projects -->
        <div style="margin-bottom: 14pt;" th:if="${not #lists.isEmpty(resume.projects)}">
          <div style="background-color: #4a7048; color: #ffffff; padding: 3.5pt 8pt; border-radius: 3pt; font-size: 8.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5pt; margin-bottom: 8pt;">
            KEY PROJECTS
          </div>
          <div th:each="p : ${resume.projects}" style="margin-bottom: 8pt;">
            <p style="font-size: 9pt; font-weight: 700; color: #0f172a; margin: 0;" th:text="${p.name()}">Project</p>
            <p style="font-size: 7.5pt; color: #4a7048; margin: 1pt 0 2pt 0;" th:if="${not #strings.isEmpty(p.techStack())}" th:text="${p.techStack()}">Tech Stack</p>
            <ul th:if="${not #lists.isEmpty(p.bullets())}" style="margin: 0; padding-left: 12pt; font-size: 8pt; color: #374151; line-height: 1.35;">
              <li th:each="b : ${p.bullets()}" th:text="${b}" style="margin-bottom: 1.5pt;">bullet</li>
            </ul>
          </div>
        </div>
      </td>
    </tr>
  </table>
</body>
</html>
