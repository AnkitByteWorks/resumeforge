<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${(not #strings.isEmpty(resume.personalInfo.fullName()) ? resume.personalInfo.fullName() : 'Resume') + ' - ResumeForge'}">Resume</title>
  <style th:utext="${css}"></style>
</head>
<body style="margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; color: #1f2937; background-color: #ffffff;">
  <div style="border-left: 10pt solid #164e63; padding: 20pt 22pt;">
    <!-- Header with Top-Right Photo -->
    <table style="width: 100%; border-collapse: collapse; margin-bottom: 10pt;">
      <tr>
        <td style="vertical-align: top;">
          <h1 style="font-size: 22pt; font-weight: 700; margin: 0 0 2pt 0; color: #0f172a; line-height: 1.1;"
              th:text="${not #strings.isEmpty(resume.personalInfo.fullName()) ? resume.personalInfo.fullName() : 'Catherine Bale'}">Catherine Bale</h1>
          <p style="font-size: 10.5pt; color: #475569; font-style: italic; margin: 0 0 6pt 0;"
             th:if="${not #strings.isEmpty(resume.personalInfo.headline())}"
             th:text="${resume.personalInfo.headline()}">Marketing Assistant</p>
          <p style="font-size: 8pt; color: #64748b; margin: 0; line-height: 1.5;"
             th:text="${not #lists.isEmpty(contacts) ? #strings.listJoin(contacts, '   |   ') : 'catherine.bale@example.com   |   +1 555-0144   |   Seattle, WA'}">contact items</p>
        </td>
        <td style="width: 70pt; text-align: right; vertical-align: top;">
          <img th:if="${not #strings.isEmpty(resume.personalInfo.photoUrl())}"
               th:src="${resume.personalInfo.photoUrl()}"
               alt="Photo"
               style="width: 55pt; height: 55pt; object-fit: cover; border-radius: 4pt; border: 1.5pt solid #cbd5e1; display: inline-block;"/>
          <div th:if="${#strings.isEmpty(resume.personalInfo.photoUrl())}"
               style="width: 55pt; height: 55pt; border-radius: 4pt; background-color: #f0fdf4; border: 1.5pt solid #164e63; display: inline-block; line-height: 55pt; text-align: center; font-size: 20pt; font-weight: bold; color: #164e63;"
               th:text="${not #strings.isEmpty(resume.personalInfo.fullName()) ? #strings.substring(resume.personalInfo.fullName(), 0, 1) : 'C'}">C</div>
        </td>
      </tr>
    </table>

    <!-- Profile -->
    <div class="section" style="margin-bottom: 11pt;" th:if="${not #strings.isEmpty(resume.summary)}">
      <h2 style="font-size: 10.5pt; font-weight: 700; color: #164e63; border-bottom: 1.5pt solid #cbd5e1; padding-bottom: 2pt; margin: 0 0 6pt 0;">Profile</h2>
      <p style="font-size: 8.5pt; line-height: 1.45; color: #334155; margin: 0;" th:text="${resume.summary}">Profile summary...</p>
    </div>

    <!-- Professional Experience -->
    <div class="section" style="margin-bottom: 12pt;" th:if="${not #lists.isEmpty(resume.experience)}">
      <h2 style="font-size: 10.5pt; font-weight: 700; color: #164e63; border-bottom: 1.5pt solid #cbd5e1; padding-bottom: 2pt; margin: 0 0 8pt 0;">Professional Experience</h2>
      <div class="entry" th:each="e : ${resume.experience}" style="margin-bottom: 9pt;">
        <table style="width: 100%; border-collapse: collapse;">
          <tr>
            <td style="font-size: 9.5pt; font-weight: 700; color: #0f172a;" th:text="${e.company() + ', ' + e.role()}">Company, Role</td>
            <td style="text-align: right; font-size: 8pt; color: #64748b;"
                th:text="${#strings.defaultString(e.startDate(),'')} + ' - ' + (${e.current()} ? 'Present' : ${#strings.defaultString(e.endDate(),'')})">Date</td>
          </tr>
        </table>
        <ul class="bullets" th:if="${not #lists.isEmpty(e.bullets())}" style="margin: 2pt 0 0 0; padding-left: 14pt; color: #334155; line-height: 1.4;">
          <li th:each="b : ${e.bullets()}" th:text="${b}" style="font-size: 8.5pt; margin-bottom: 1.8pt;">bullet</li>
        </ul>
      </div>
    </div>

    <!-- Education -->
    <div class="section" style="margin-bottom: 11pt;" th:if="${not #lists.isEmpty(resume.education)}">
      <h2 style="font-size: 10.5pt; font-weight: 700; color: #164e63; border-bottom: 1.5pt solid #cbd5e1; padding-bottom: 2pt; margin: 0 0 7pt 0;">Education</h2>
      <div class="entry" th:each="ed : ${resume.education}" style="margin-bottom: 7pt;">
        <table style="width: 100%; border-collapse: collapse;">
          <tr>
            <td style="font-size: 9pt; font-weight: 700; color: #0f172a;" th:text="${ed.institution()}">Institution</td>
            <td style="text-align: right; font-size: 8pt; color: #64748b;"
                th:text="${#strings.defaultString(ed.startDate(),'')} + ' - ' + ${#strings.defaultString(ed.endDate(),'')}">Dates</td>
          </tr>
        </table>
        <p style="font-size: 8.5pt; color: #475569; margin: 1pt 0 0 0;"
           th:text="${ed.degree() + (ed.field() != null ? ' in ' + ed.field() : '')}">Degree</p>
      </div>
    </div>

    <!-- Projects -->
    <div class="section" style="margin-bottom: 11pt;" th:if="${not #lists.isEmpty(resume.projects)}">
      <h2 style="font-size: 10.5pt; font-weight: 700; color: #164e63; border-bottom: 1.5pt solid #cbd5e1; padding-bottom: 2pt; margin: 0 0 7pt 0;">Projects</h2>
      <div class="entry" th:each="p : ${resume.projects}" style="margin-bottom: 7pt;">
        <p style="font-size: 9pt; font-weight: 700; color: #0f172a; margin: 0;" th:text="${p.name()}">Project</p>
        <p style="font-size: 8pt; color: #164e63; margin: 1pt 0 2pt 0;" th:if="${not #strings.isEmpty(p.techStack())}" th:text="${p.techStack()}">Tech Stack</p>
        <ul class="bullets" th:if="${not #lists.isEmpty(p.bullets())}" style="margin: 0; padding-left: 14pt; color: #334155; line-height: 1.35;">
          <li th:each="b : ${p.bullets()}" th:text="${b}" style="font-size: 8.5pt; margin-bottom: 1.5pt;">bullet</li>
        </ul>
      </div>
    </div>

    <!-- Skills -->
    <div class="section" style="margin-bottom: 10pt;" th:if="${not #lists.isEmpty(resume.skills)}">
      <h2 style="font-size: 10.5pt; font-weight: 700; color: #164e63; border-bottom: 1.5pt solid #cbd5e1; padding-bottom: 2pt; margin: 0 0 6pt 0;">Key Skills</h2>
      <p style="font-size: 8.5pt; color: #334155; line-height: 1.5; margin: 0;"
         th:text="${#strings.listJoin(resume.skills, '   |   ')}">Skills</p>
    </div>
  </div>
</body>
</html>
