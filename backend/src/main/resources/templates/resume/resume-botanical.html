<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${resume.personalInfo.fullName()} + ' - Resume'">Resume</title>
  <style th:utext="${css}"></style>
</head>
<body style="margin: 0; padding: 20pt 25pt; border-left: 14pt solid #164e63; font-family: 'Helvetica Neue', Arial, sans-serif; color: #1f2937; background-color: #ffffff;">
  <!-- Header with Top-Right Photo -->
  <table style="width: 100%; border-collapse: collapse; margin-bottom: 12pt;">
    <tr>
      <td style="vertical-align: top;">
        <h1 style="font-size: 22pt; font-weight: 700; margin: 0 0 3pt 0; color: #0f172a;"
            th:text="${resume.personalInfo.fullName()}">Catherine Bale</h1>
        <p style="font-size: 11pt; color: #475569; font-style: italic; margin: 0 0 8pt 0;"
           th:if="${not #strings.isEmpty(resume.personalInfo.headline())}"
           th:text="${resume.personalInfo.headline()}">Marketing Assistant</p>
        <p style="font-size: 8pt; color: #64748b; margin: 0; line-height: 1.5;"
           th:text="${#strings.listJoin(contacts, '   •   ')}">contact items</p>
      </td>
      <td style="width: 80pt; text-align: right; vertical-align: top;">
        <img th:if="${not #strings.isEmpty(resume.personalInfo.photoUrl())}"
             th:src="${resume.personalInfo.photoUrl()}"
             alt="Photo"
             style="width: 70pt; height: 70pt; object-fit: cover; border-radius: 4pt; border: 1px solid #cbd5e1; display: inline-block;"/>
      </td>
    </tr>
  </table>

  <!-- Profile -->
  <div style="margin-bottom: 12pt;" th:if="${not #strings.isEmpty(resume.summary)}">
    <h2 style="font-size: 11pt; font-weight: 700; color: #0f172a; border-bottom: 1px solid #cbd5e1; padding-bottom: 3pt; margin: 0 0 6pt 0;">Profile</h2>
    <p style="font-size: 8.5pt; line-height: 1.45; color: #334155; margin: 0;" th:text="${resume.summary}">Profile summary...</p>
  </div>

  <!-- Professional Experience -->
  <div style="margin-bottom: 12pt;" th:if="${not #lists.isEmpty(resume.experience)}">
    <h2 style="font-size: 11pt; font-weight: 700; color: #0f172a; border-bottom: 1px solid #cbd5e1; padding-bottom: 3pt; margin: 0 0 8pt 0;">Professional Experience</h2>
    <div th:each="e : ${resume.experience}" style="margin-bottom: 9pt;">
      <table style="width: 100%; border-collapse: collapse;">
        <tr>
          <td style="font-size: 9.5pt; font-weight: 700; color: #0f172a;" th:text="${e.company() + ', ' + e.role()}">Company, Role</td>
          <td style="text-align: right; font-size: 8pt; color: #64748b;"
              th:text="${#strings.defaultString(e.startDate(),'')} + ' - ' + (${e.current()} ? 'Present' : ${#strings.defaultString(e.endDate(),'')})">Date</td>
        </tr>
      </table>
      <ul th:if="${not #lists.isEmpty(e.bullets())}" style="margin: 2pt 0 0 0; padding-left: 14pt; font-size: 8.5pt; color: #334155; line-height: 1.4;">
        <li th:each="b : ${e.bullets()}" th:text="${b}" style="margin-bottom: 2pt;">bullet</li>
      </ul>
    </div>
  </div>

  <!-- Education -->
  <div style="margin-bottom: 12pt;" th:if="${not #lists.isEmpty(resume.education)}">
    <h2 style="font-size: 11pt; font-weight: 700; color: #0f172a; border-bottom: 1px solid #cbd5e1; padding-bottom: 3pt; margin: 0 0 8pt 0;">Education</h2>
    <div th:each="e : ${resume.education}" style="margin-bottom: 8pt;">
      <table style="width: 100%; border-collapse: collapse;">
        <tr>
          <td style="font-size: 9pt; font-weight: 700; color: #0f172a;" th:text="${e.institution() + ', ' + e.degree()}">Institution, Degree</td>
          <td style="text-align: right; font-size: 8pt; color: #64748b;"
              th:text="${#strings.defaultString(e.startDate(),'')} + ' - ' + ${#strings.defaultString(e.endDate(),'')}">Dates</td>
        </tr>
      </table>
    </div>
  </div>

  <!-- Certificates -->
  <div style="margin-bottom: 12pt;" th:if="${not #lists.isEmpty(resume.certifications)}">
    <h2 style="font-size: 11pt; font-weight: 700; color: #0f172a; border-bottom: 1px solid #cbd5e1; padding-bottom: 3pt; margin: 0 0 6pt 0;">Certificates</h2>
    <p style="font-size: 8.5pt; color: #334155; margin: 0;"
       th:text="${#strings.listJoin(resume.certifications, '   •   ')}">Certs</p>
  </div>

  <!-- Skills in 2 columns -->
  <div style="margin-bottom: 12pt;" th:if="${not #lists.isEmpty(resume.skills)}">
    <h2 style="font-size: 11pt; font-weight: 700; color: #0f172a; border-bottom: 1px solid #cbd5e1; padding-bottom: 3pt; margin: 0 0 8pt 0;">Skills</h2>
    <table style="width: 100%; border-collapse: collapse;">
      <tr>
        <td style="font-size: 8.5pt; color: #334155; line-height: 1.6;">
          <span th:each="s : ${resume.skills}" th:text="'• ' + ${s} + '    '">• Skill </span>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
