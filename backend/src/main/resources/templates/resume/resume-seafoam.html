<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${(not #strings.isEmpty(resume.personalInfo.fullName()) ? resume.personalInfo.fullName() : 'Resume') + ' - ResumeForge'}">Resume</title>
  <style th:utext="${css}"></style>
</head>
<body style="margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; color: #1e293b; background-color: #ffffff;">
  <!-- Seafoam Top Name Box -->
  <div style="background-color: #d1e7dd; padding: 10pt; text-align: center; border-radius: 2pt; margin-bottom: 6pt;">
    <h1 class="name" style="font-size: 22pt; font-weight: 800; text-transform: uppercase; letter-spacing: 2.5pt; color: #0f5132; margin: 0;"
        th:text="${not #strings.isEmpty(resume.personalInfo.fullName()) ? resume.personalInfo.fullName() : 'NELLY SMITH'}">NELLY SMITH</h1>
  </div>
  <p class="headline" style="text-align: center; font-size: 9.5pt; color: #14532d; font-weight: 600; margin: 0 0 10pt 0; letter-spacing: 0.5pt;"
     th:if="${not #strings.isEmpty(resume.personalInfo.headline())}"
     th:text="${resume.personalInfo.headline()}">Senior Graphic Designer</p>

  <!-- 3-Column Header Bar: Contact | Summary | Skills -->
  <table style="width: 100%; border-collapse: collapse; margin-bottom: 12pt;">
    <tr>
      <!-- Column 1: Contact -->
      <td style="width: 28%; vertical-align: top; padding-right: 10pt;">
        <div style="background-color: #e2f0d9; color: #0f5132; font-size: 8.5pt; font-weight: 700; text-transform: uppercase; padding: 2.5pt 6pt; margin-bottom: 5pt; letter-spacing: 0.5pt;">
          CONTACT
        </div>
        <div class="contact" style="font-size: 8pt; color: #334155; line-height: 1.55;">
          <div th:if="${not #strings.isEmpty(resume.personalInfo.phone())}"><span style="color: #0f5132;">&#9742;</span>&#160;<span th:text="${resume.personalInfo.phone()}">phone</span></div>
          <div th:if="${not #strings.isEmpty(resume.personalInfo.email())}"><span style="color: #0f5132;">&#9993;</span>&#160;<span th:text="${resume.personalInfo.email()}">email</span></div>
          <div th:if="${not #strings.isEmpty(resume.personalInfo.location())}"><span style="color: #0f5132;">&#9873;</span>&#160;<span th:text="${resume.personalInfo.location()}">location</span></div>
          <div th:if="${not #strings.isEmpty(resume.personalInfo.linkedin())}"><span style="color: #0f5132; font-weight: bold;">in</span>&#160;<span th:text="${resume.personalInfo.linkedin()}">linkedin</span></div>
          <div th:if="${#strings.isEmpty(resume.personalInfo.email()) and #strings.isEmpty(resume.personalInfo.phone()) and #strings.isEmpty(resume.personalInfo.location())}" style="color: #94a3b8; font-style: italic;">
            <span style="color: #0f5132;">&#9993;</span>&#160;nelly@example.com
          </div>
        </div>
      </td>

      <!-- Column 2: Summary -->
      <td style="width: 44%; vertical-align: top; padding-right: 10pt;">
        <div style="background-color: #e2f0d9; color: #0f5132; font-size: 8.5pt; font-weight: 700; text-transform: uppercase; padding: 2.5pt 6pt; margin-bottom: 5pt; letter-spacing: 0.5pt;">
          SUMMARY
        </div>
        <p class="summary-text" style="color: #334155; font-size: 8pt; line-height: 1.45; margin: 0;"
           th:if="${not #strings.isEmpty(resume.summary)}"
           th:text="${resume.summary}">Senior specialist summary...</p>
      </td>

      <!-- Column 3: Skills with Bars -->
      <td style="width: 28%; vertical-align: top;">
        <div style="background-color: #e2f0d9; color: #0f5132; font-size: 8.5pt; font-weight: 700; text-transform: uppercase; padding: 2.5pt 6pt; margin-bottom: 5pt; letter-spacing: 0.5pt;">
          CORE SKILLS
        </div>
        <table style="width: 100%; border-collapse: collapse;">
          <tr th:each="s, stat : ${resume.skills}" th:if="${stat.index < 4}">
            <td style="color: #334155; font-size: 8pt; padding: 2pt 0;" th:text="${s}">Skill</td>
            <td style="text-align: right; vertical-align: middle; padding: 2pt 0;">
              <span style="display: inline-block; width: 34pt; height: 3pt; background-color: #0f5132; border-radius: 1.5pt;"></span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

  <!-- Thin Rule -->
  <div style="border-top: 1.5pt solid #d1e7dd; margin-bottom: 12pt;"></div>

  <!-- WORK EXPERIENCE -->
  <div class="section" style="margin-bottom: 12pt;" th:if="${not #lists.isEmpty(resume.experience)}">
    <div style="background-color: #e2f0d9; color: #0f5132; font-size: 9.5pt; font-weight: 700; text-transform: uppercase; padding: 3pt 8pt; margin-bottom: 8pt; letter-spacing: 0.5pt; border-radius: 2pt;">
      WORK EXPERIENCE
    </div>
    <div class="entry" th:each="e : ${resume.experience}" style="margin-bottom: 9pt;">
      <table style="width: 100%; border-collapse: collapse;">
        <tr>
          <td style="font-size: 9.5pt; font-weight: 700; color: #0f5132;" th:text="${e.role()}">Role</td>
          <td style="text-align: right; font-size: 8pt; color: #64748b;"
              th:text="${#strings.defaultString(e.startDate(),'')} + ' - ' + (${e.current()} ? 'Present' : ${#strings.defaultString(e.endDate(),'')})">Date</td>
        </tr>
      </table>
      <p style="font-size: 8.5pt; color: #334155; font-weight: 600; margin: 1pt 0 3pt 0;" th:text="${e.company()}">Company</p>
      <ul class="bullets" th:if="${not #lists.isEmpty(e.bullets())}" style="margin: 0; padding-left: 12pt; color: #334155; line-height: 1.38;">
        <li th:each="b : ${e.bullets()}" th:text="${b}" style="font-size: 8.5pt; margin-bottom: 1.8pt;">bullet</li>
      </ul>
    </div>
  </div>

  <!-- 2 Column Split for Education & Projects -->
  <table style="width: 100%; border-collapse: collapse;">
    <tr>
      <!-- LEFT: EDUCATION -->
      <td style="width: 50%; vertical-align: top; padding-right: 10pt;">
        <div class="section" style="margin-bottom: 10pt;" th:if="${not #lists.isEmpty(resume.education)}">
          <div style="background-color: #e2f0d9; color: #0f5132; font-size: 9.5pt; font-weight: 700; text-transform: uppercase; padding: 3pt 8pt; margin-bottom: 7pt; letter-spacing: 0.5pt; border-radius: 2pt;">
            EDUCATION
          </div>
          <div class="entry" th:each="ed : ${resume.education}" style="margin-bottom: 7pt;">
            <p style="font-size: 9pt; font-weight: 700; color: #0f5132; margin: 0;"
               th:text="${ed.degree() + (ed.field() != null ? ' in ' + ed.field() : '')}">Degree</p>
            <p style="font-size: 8.5pt; color: #475569; margin: 1pt 0 0 0;" th:text="${ed.institution()}">Institution</p>
            <p style="font-size: 8pt; color: #64748b; margin: 0;"
               th:text="${#strings.defaultString(ed.startDate(),'')} + ' - ' + ${#strings.defaultString(ed.endDate(),'')}">Dates</p>
          </div>
        </div>
      </td>

      <!-- RIGHT: PROJECTS -->
      <td style="width: 50%; vertical-align: top; padding-left: 10pt;">
        <div class="section" style="margin-bottom: 10pt;" th:if="${not #lists.isEmpty(resume.projects)}">
          <div style="background-color: #e2f0d9; color: #0f5132; font-size: 9.5pt; font-weight: 700; text-transform: uppercase; padding: 3pt 8pt; margin-bottom: 7pt; letter-spacing: 0.5pt; border-radius: 2pt;">
            PROJECTS
          </div>
          <div class="entry" th:each="p : ${resume.projects}" style="margin-bottom: 7pt;">
            <p style="font-size: 9pt; font-weight: 700; color: #0f5132; margin: 0;" th:text="${p.name()}">Project</p>
            <p style="font-size: 8pt; color: #15803d; margin: 1pt 0 2pt 0;" th:if="${not #strings.isEmpty(p.techStack())}" th:text="${p.techStack()}">Tech</p>
            <ul class="bullets" th:if="${not #lists.isEmpty(p.bullets())}" style="margin: 0; padding-left: 12pt; color: #334155; line-height: 1.35;">
              <li th:each="b : ${p.bullets()}" th:text="${b}" style="font-size: 8.5pt; margin-bottom: 1.5pt;">bullet</li>
            </ul>
          </div>
        </div>
      </td>
    </tr>
  </table>
</body>
</html>
