<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${(not #strings.isEmpty(resume.personalInfo.fullName()) ? resume.personalInfo.fullName() : 'Resume') + ' - ResumeForge'}">Resume</title>
  <style th:utext="${css}"></style>
</head>
<body style="margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #ffffff;">
  <table class="layout-table" style="width: 100%; border-collapse: collapse; height: 100%; min-height: 297mm;">
    <tr>
      <!-- LEFT DARK TEAL SIDEBAR -->
      <td class="sidebar-col" style="width: 32%; vertical-align: top; background-color: #083344; color: #ffffff; padding: 20pt 14pt;">
        <!-- Circular Avatar with White Border -->
        <div style="text-align: center; margin-bottom: 14pt;">
          <img th:if="${not #strings.isEmpty(resume.personalInfo.photoUrl())}"
               th:src="${resume.personalInfo.photoUrl()}"
               alt="Photo"
               style="width: 55pt; height: 55pt; border-radius: 50%; border: 2.5pt solid #ffffff; object-fit: cover; display: inline-block;"/>
          <div th:if="${#strings.isEmpty(resume.personalInfo.photoUrl())}"
               style="width: 55pt; height: 55pt; border-radius: 50%; background-color: #164e63; border: 2.5pt solid #ffffff; display: inline-block; line-height: 55pt; font-size: 20pt; font-weight: bold; color: #67e8f9;"
               th:text="${not #strings.isEmpty(resume.personalInfo.fullName()) ? #strings.substring(resume.personalInfo.fullName(), 0, 1) : 'N'}">N</div>
        </div>

        <!-- Contact Section -->
        <div class="section" style="margin-bottom: 14pt;">
          <h3 style="color: #2dd4bf; font-size: 9pt; font-weight: 700; text-transform: uppercase; letter-spacing: 1pt; margin: 0 0 8pt 0; border-bottom: 1px solid #155e75; padding-bottom: 2pt;">CONTACT</h3>
          <div style="font-size: 8pt; color: #e2e8f0; line-height: 1.6;">
            <div th:if="${not #strings.isEmpty(resume.personalInfo.phone())}" style="margin-bottom: 4pt;">
              <span style="color: #2dd4bf;">&#9742;</span>&#160;<span th:text="${resume.personalInfo.phone()}">phone</span>
            </div>
            <div th:if="${not #strings.isEmpty(resume.personalInfo.email())}" style="margin-bottom: 4pt;">
              <span style="color: #2dd4bf;">&#9993;</span>&#160;<span th:text="${resume.personalInfo.email()}">email</span>
            </div>
            <div th:if="${not #strings.isEmpty(resume.personalInfo.location())}" style="margin-bottom: 4pt;">
              <span style="color: #2dd4bf;">&#9873;</span>&#160;<span th:text="${resume.personalInfo.location()}">location</span>
            </div>
            <div th:if="${not #strings.isEmpty(resume.personalInfo.linkedin())}" style="margin-bottom: 4pt;">
              <span style="color: #2dd4bf; font-weight: bold;">in</span>&#160;<span th:text="${resume.personalInfo.linkedin()}">linkedin</span>
            </div>
            <div th:if="${#strings.isEmpty(resume.personalInfo.email()) and #strings.isEmpty(resume.personalInfo.phone()) and #strings.isEmpty(resume.personalInfo.location())}" style="color: #94a3b8; font-style: italic;">
              <span style="color: #2dd4bf;">&#9993;</span>&#160;natalie@example.com
            </div>
          </div>
        </div>

        <!-- Skills Section with Sleek Bars -->
        <div class="section" style="margin-bottom: 14pt;" th:if="${not #lists.isEmpty(resume.skills)}">
          <h3 style="color: #2dd4bf; font-size: 9pt; font-weight: 700; text-transform: uppercase; letter-spacing: 1pt; margin: 0 0 8pt 0; border-bottom: 1px solid #155e75; padding-bottom: 2pt;">SKILLS</h3>
          <table style="width: 100%; border-collapse: collapse;">
            <tr th:each="s : ${resume.skills}">
              <td style="font-size: 8pt; color: #f1f5f9; padding: 2pt 0;" th:text="${s}">Skill</td>
              <td style="text-align: right; padding: 2pt 0; vertical-align: middle;">
                <span style="display: inline-block; width: 36pt; height: 3pt; background-color: #2dd4bf; border-radius: 1.5pt;"></span>
              </td>
            </tr>
          </table>
        </div>

        <!-- Certifications in Sidebar -->
        <div class="section" style="margin-bottom: 12pt;" th:if="${not #lists.isEmpty(resume.certifications)}">
          <h3 style="color: #2dd4bf; font-size: 9pt; font-weight: 700; text-transform: uppercase; letter-spacing: 1pt; margin: 0 0 6pt 0; border-bottom: 1px solid #155e75; padding-bottom: 2pt;">CERTIFICATES</h3>
          <div th:each="c : ${resume.certifications}" style="font-size: 8pt; color: #e2e8f0; margin-bottom: 3pt;" th:text="${c}">Cert</div>
        </div>
      </td>

      <!-- RIGHT WHITE MAIN COLUMN -->
      <td class="main-col" style="width: 68%; vertical-align: top; padding: 20pt 20pt;">
        <!-- Header Name & Title -->
        <div style="margin-bottom: 12pt;">
          <h1 style="font-size: 22pt; font-weight: 800; text-transform: uppercase; margin: 0 0 2pt 0; letter-spacing: 0.5pt; color: #0f172a;"
              th:text="${not #strings.isEmpty(resume.personalInfo.fullName()) ? resume.personalInfo.fullName() : 'NATALIE EDWARDS'}">NATALIE EDWARDS</h1>
          <p th:if="${not #strings.isEmpty(resume.personalInfo.headline())}"
             th:text="${resume.personalInfo.headline()}"
             style="font-size: 10pt; text-transform: uppercase; letter-spacing: 1.5pt; color: #0d9488; margin: 0 0 6pt 0; font-weight: 600;">Marketing Executive</p>
          <p style="color: #475569; font-size: 8.5pt; line-height: 1.45; margin: 0;"
             th:if="${not #strings.isEmpty(resume.summary)}"
             th:text="${resume.summary}">Profile summary...</p>
        </div>

        <!-- Thin Divider -->
        <div style="border-top: 1.5pt solid #ccfbf1; margin-bottom: 12pt;"></div>

        <!-- Work Experience with Left Timeline Accent -->
        <div class="section" style="margin-bottom: 12pt;" th:if="${not #lists.isEmpty(resume.experience)}">
          <h2 style="font-size: 10pt; font-weight: 800; text-transform: uppercase; letter-spacing: 1pt; color: #0f766e; margin: 0 0 8pt 0;">EXPERIENCE</h2>
          <div class="entry" th:each="e : ${resume.experience}" style="margin-bottom: 9pt; border-left: 2pt solid #2dd4bf; padding-left: 8pt;">
            <p style="font-size: 9.5pt; font-weight: 700; color: #0f172a; margin: 0;" th:text="${e.role()}">Role</p>
            <p style="font-size: 8.5pt; color: #0d9488; font-weight: 600; margin: 1pt 0;" th:text="${e.company()}">Company</p>
            <p style="font-size: 8pt; color: #94a3b8; margin: 0 0 3pt 0;"
               th:text="${#strings.defaultString(e.startDate(),'')} + ' - ' + (${e.current()} ? 'Present' : ${#strings.defaultString(e.endDate(),'')})">Dates</p>
            <ul class="bullets" th:if="${not #lists.isEmpty(e.bullets())}" style="margin: 0; padding-left: 12pt; color: #334155; line-height: 1.38;">
              <li th:each="b : ${e.bullets()}" th:text="${b}" style="font-size: 8.5pt; margin-bottom: 1.8pt;">bullet</li>
            </ul>
          </div>
        </div>

        <!-- Education -->
        <div class="section" style="margin-bottom: 12pt;" th:if="${not #lists.isEmpty(resume.education)}">
          <h2 style="font-size: 10pt; font-weight: 800; text-transform: uppercase; letter-spacing: 1pt; color: #0f766e; margin: 0 0 7pt 0;">EDUCATION</h2>
          <div class="entry" th:each="e : ${resume.education}" style="margin-bottom: 7pt; border-left: 2pt solid #2dd4bf; padding-left: 8pt;">
            <p style="font-size: 9pt; font-weight: 700; color: #0f172a; margin: 0;"
               th:text="${e.degree() + (e.field() != null ? ' in ' + e.field() : '')}">Degree</p>
            <p style="font-size: 8.5pt; color: #475569; margin: 1pt 0 0 0;" th:text="${e.institution()}">Institution</p>
            <p style="font-size: 8pt; color: #94a3b8; margin: 0;"
               th:text="${#strings.defaultString(e.startDate(),'')} + ' - ' + ${#strings.defaultString(e.endDate(),'')}">Dates</p>
          </div>
        </div>

        <!-- Projects -->
        <div class="section" style="margin-bottom: 10pt;" th:if="${not #lists.isEmpty(resume.projects)}">
          <h2 style="font-size: 10pt; font-weight: 800; text-transform: uppercase; letter-spacing: 1pt; color: #0f766e; margin: 0 0 7pt 0;">PROJECTS</h2>
          <div class="entry" th:each="p : ${resume.projects}" style="margin-bottom: 7pt; border-left: 2pt solid #2dd4bf; padding-left: 8pt;">
            <p style="font-size: 9pt; font-weight: 700; color: #0f172a; margin: 0;" th:text="${p.name()}">Project</p>
            <p style="font-size: 8pt; color: #0d9488; margin: 1pt 0 2pt 0;" th:if="${not #strings.isEmpty(p.techStack())}" th:text="${p.techStack()}">Tech</p>
            <ul class="bullets" th:if="${not #lists.isEmpty(p.bullets())}" style="margin: 0; padding-left: 12pt; color: #334155; line-height: 1.35;">
              <li th:each="b : ${p.bullets()}" th:text="${b}" style="font-size: 8.5pt; margin-bottom: 1.5pt;">bullet</li>
            </ul>
          </div>
        </div>
      </td>
    </tr>
  </table>
</body>
</html>
