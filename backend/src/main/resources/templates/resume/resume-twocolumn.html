<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${resume.personalInfo.fullName()} + ' - Resume'">Resume</title>
  <style th:utext="${css}"></style>
</head>
<body>
  <table class="layout-table">
    <tr>
      <!-- LEFT SIDEBAR -->
      <td class="sidebar-col">
        <!-- Profile Photo (if present) -->
        <div class="photo-container" th:if="${not #strings.isEmpty(resume.personalInfo.photoUrl())}">
          <img class="profile-photo" th:src="${resume.personalInfo.photoUrl()}" alt="Profile Photo"/>
        </div>

        <!-- Contact Details -->
        <div class="sidebar-section">
          <h3 class="sidebar-title">Contact</h3>
          <ul class="contact-list">
            <li th:if="${not #strings.isEmpty(resume.personalInfo.email())}" th:text="${resume.personalInfo.email()}">email</li>
            <li th:if="${not #strings.isEmpty(resume.personalInfo.phone())}" th:text="${resume.personalInfo.phone()}">phone</li>
            <li th:if="${not #strings.isEmpty(resume.personalInfo.location())}" th:text="${resume.personalInfo.location()}">location</li>
            <li th:if="${not #strings.isEmpty(resume.personalInfo.linkedin())}" th:text="${resume.personalInfo.linkedin()}">linkedin</li>
            <li th:if="${not #strings.isEmpty(resume.personalInfo.github())}" th:text="${resume.personalInfo.github()}">github</li>
            <li th:if="${not #strings.isEmpty(resume.personalInfo.portfolio())}" th:text="${resume.personalInfo.portfolio()}">portfolio</li>
          </ul>
        </div>

        <!-- Skills in Sidebar -->
        <div class="sidebar-section" th:if="${not #lists.isEmpty(resume.skills)}">
          <h3 class="sidebar-title">Skills</h3>
          <ul class="skills-list">
            <li th:each="s : ${resume.skills}" th:text="${s}">skill</li>
          </ul>
        </div>

        <!-- Certifications in Sidebar -->
        <div class="sidebar-section" th:if="${not #lists.isEmpty(resume.certifications)}">
          <h3 class="sidebar-title">Certifications</h3>
          <ul class="cert-list">
            <li th:each="c : ${resume.certifications}" th:text="${c}">cert</li>
          </ul>
        </div>
      </td>

      <!-- RIGHT MAIN CONTENT -->
      <td class="main-col">
        <!-- Header Banner -->
        <div class="header-box">
          <h1 class="name" th:text="${resume.personalInfo.fullName()}">Name</h1>
          <p class="headline" th:if="${not #strings.isEmpty(resume.personalInfo.headline())}" th:text="${resume.personalInfo.headline()}">Headline</p>
          <p class="summary-text" th:if="${not #strings.isEmpty(resume.summary)}" th:text="${resume.summary}">Summary</p>
        </div>

        <!-- Experience -->
        <div class="main-section" th:if="${not #lists.isEmpty(resume.experience)}">
          <h2 class="main-heading">Experience</h2>
          <div class="entry" th:each="e : ${resume.experience}">
            <p class="entry-title" th:text="${e.role() + ' - ' + e.company()}">Role - Company</p>
            <p class="entry-meta"
               th:text="${#strings.defaultString(e.startDate(),'')} + ' - ' + (${e.current()} ? 'Present' : ${#strings.defaultString(e.endDate(),'')})">dates</p>
            <ul th:if="${not #lists.isEmpty(e.bullets())}">
              <li th:each="b : ${e.bullets()}" th:text="${b}">bullet</li>
            </ul>
          </div>
        </div>

        <!-- Education -->
        <div class="main-section" th:if="${not #lists.isEmpty(resume.education)}">
          <h2 class="main-heading">Education</h2>
          <div class="entry" th:each="e : ${resume.education}">
            <p class="entry-title" th:text="${e.degree() + (e.field() != null ? ' in ' + e.field() : '')}">Degree in Field</p>
            <p class="entry-subtitle" th:text="${e.institution()}">Institution</p>
            <p class="entry-meta"
               th:text="${#strings.defaultString(e.startDate(),'')} + ' - ' + ${#strings.defaultString(e.endDate(),'')} + (${not #strings.isEmpty(e.score())} ? ' | GPA: ' + ${e.score()} : '')">dates</p>
          </div>
        </div>

        <!-- Projects -->
        <div class="main-section" th:if="${not #lists.isEmpty(resume.projects)}">
          <h2 class="main-heading">Projects</h2>
          <div class="entry" th:each="p : ${resume.projects}">
            <p class="entry-title" th:text="${p.name()}">Project</p>
            <p class="entry-meta" th:if="${not #strings.isEmpty(p.techStack())}" th:text="'Tech: ' + ${p.techStack()}">Tech</p>
            <p class="entry-meta" th:if="${not #strings.isEmpty(p.link())}" th:text="${p.link()}">Link</p>
            <ul th:if="${not #lists.isEmpty(p.bullets())}">
              <li th:each="b : ${p.bullets()}" th:text="${b}">bullet</li>
            </ul>
          </div>
        </div>
      </td>
    </tr>
  </table>
</body>
</html>
