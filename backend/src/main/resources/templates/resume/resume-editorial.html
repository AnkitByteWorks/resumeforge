<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${(not #strings.isEmpty(resume.personalInfo.fullName()) ? resume.personalInfo.fullName() : 'Resume') + ' - ResumeForge'}">Resume</title>
  <style th:utext="${css}"></style>
</head>
<body style="margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f3ee; color: #18181b;">
  <!-- Top Thick Black Bar -->
  <div style="border-top: 4.5pt solid #18181b; margin-bottom: 12pt;"></div>

  <!-- Hello Header -->
  <div style="margin-bottom: 14pt;">
    <p style="font-size: 16pt; font-weight: 300; margin: 0 0 2pt 0; color: #18181b; letter-spacing: -0.2pt;">Hello! I'm</p>
    <h1 style="font-size: 26pt; font-weight: 900; margin: 0 0 6pt 0; color: #09090b; letter-spacing: -0.4pt; line-height: 1.05;"
        th:text="${not #strings.isEmpty(resume.personalInfo.fullName()) ? resume.personalInfo.fullName() : 'Jane Smith'}">Jane Smith</h1>
    <p style="font-size: 9.5pt; font-weight: 700; color: #52525b; text-transform: uppercase; letter-spacing: 1pt; margin: 0 0 4pt 0;"
       th:if="${not #strings.isEmpty(resume.personalInfo.headline())}"
       th:text="${resume.personalInfo.headline()}">Dedicated Professional</p>
    <p style="font-size: 8.5pt; line-height: 1.45; color: #3f3f46; margin: 0; max-width: 95%;"
       th:if="${not #strings.isEmpty(resume.summary)}"
       th:text="${resume.summary}">Dedicated teacher summary...</p>
  </div>

  <!-- 2 Columns Layout -->
  <table style="width: 100%; border-collapse: collapse; margin-bottom: 14pt;">
    <tr>
      <!-- LEFT COLUMN: EXPERIENCE -->
      <td style="width: 55%; vertical-align: top; padding-right: 18pt;">
        <div class="section" th:if="${not #lists.isEmpty(resume.experience)}" style="margin-bottom: 12pt;">
          <div style="border-top: 2pt solid #18181b; padding-top: 3pt; margin-bottom: 8pt;">
            <h2 style="font-size: 10pt; font-weight: 900; text-transform: uppercase; margin: 0; letter-spacing: 0.5pt; color: #09090b;">EXPERIENCE</h2>
          </div>
          <div class="entry" th:each="e : ${resume.experience}" style="margin-bottom: 10pt;">
            <p style="font-size: 9.5pt; font-weight: 800; color: #18181b; margin: 0;" th:text="${e.role()}">Role</p>
            <p style="font-size: 8.5pt; font-weight: 600; color: #3f3f46; margin: 1pt 0;" th:text="${e.company()}">Company</p>
            <p style="font-size: 8pt; color: #71717a; margin: 0 0 3pt 0;"
               th:text="${#strings.defaultString(e.startDate(),'')} + ' - ' + (${e.current()} ? 'Present' : ${#strings.defaultString(e.endDate(),'')})">Dates</p>
            <ul class="bullets" th:if="${not #lists.isEmpty(e.bullets())}" style="margin: 0; padding-left: 12pt; color: #27272a; line-height: 1.4;">
              <li th:each="b : ${e.bullets()}" th:text="${b}" style="font-size: 8.5pt; margin-bottom: 2pt;">bullet</li>
            </ul>
          </div>
        </div>
      </td>

      <!-- RIGHT COLUMN: EDUCATION, CERTS, SKILLS -->
      <td style="width: 45%; vertical-align: top;">
        <!-- Education -->
        <div class="section" style="margin-bottom: 12pt;" th:if="${not #lists.isEmpty(resume.education)}">
          <div style="border-top: 2pt solid #18181b; padding-top: 3pt; margin-bottom: 6pt;">
            <h2 style="font-size: 10pt; font-weight: 900; text-transform: uppercase; margin: 0; letter-spacing: 0.5pt; color: #09090b;">EDUCATION</h2>
          </div>
          <div class="entry" th:each="e : ${resume.education}" style="margin-bottom: 7pt;">
            <p style="font-size: 9pt; font-weight: 800; color: #18181b; margin: 0;"
               th:text="${e.degree() + (e.field() != null ? ' in ' + e.field() : '')}">Degree</p>
            <p style="font-size: 8.5pt; color: #52525b; margin: 1pt 0 0 0;"
               th:text="${e.institution()} + ' | ' + ${#strings.defaultString(e.startDate(),'')} + ' - ' + ${#strings.defaultString(e.endDate(),'')}">School | Dates</p>
          </div>
        </div>

        <!-- Certifications -->
        <div class="section" style="margin-bottom: 12pt;" th:if="${not #lists.isEmpty(resume.certifications)}">
          <div style="border-top: 2pt solid #18181b; padding-top: 3pt; margin-bottom: 6pt;">
            <h2 style="font-size: 10pt; font-weight: 900; text-transform: uppercase; margin: 0; letter-spacing: 0.5pt; color: #09090b;">CERTIFICATES</h2>
          </div>
          <div class="entry" th:each="c : ${resume.certifications}" style="margin-bottom: 4pt; font-size: 8.5pt; color: #27272a; font-weight: 600;" th:text="${c}">Cert</div>
        </div>

        <!-- Skills -->
        <div class="section" style="margin-bottom: 12pt;" th:if="${not #lists.isEmpty(resume.skills)}">
          <div style="border-top: 2pt solid #18181b; padding-top: 3pt; margin-bottom: 6pt;">
            <h2 style="font-size: 10pt; font-weight: 900; text-transform: uppercase; margin: 0; letter-spacing: 0.5pt; color: #09090b;">SKILLS</h2>
          </div>
          <ul class="bullets" style="margin: 0; padding-left: 12pt; color: #27272a; line-height: 1.45;">
            <li th:each="s : ${resume.skills}" th:text="${s}" style="font-size: 8.5pt; margin-bottom: 2pt;">Skill</li>
          </ul>
        </div>
      </td>
    </tr>
  </table>

  <!-- Bottom Contact Bar -->
  <div style="border-top: 2pt solid #18181b; padding-top: 5pt; margin-top: 10pt;">
    <p style="font-size: 8.5pt; font-weight: 900; text-transform: uppercase; margin: 0 0 2pt 0; letter-spacing: 0.5pt; color: #09090b;">CONTACT</p>
    <p style="font-size: 8pt; color: #52525b; margin: 0;"
       th:text="${not #lists.isEmpty(contacts) ? #strings.listJoin(contacts, '   |   ') : 'jane.smith@example.com   |   +1 555-0199   |   New York, NY'}">contact items</p>
  </div>
</body>
</html>
