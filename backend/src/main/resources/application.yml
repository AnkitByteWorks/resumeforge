spring:
  application:
    name: resume-backend
  mongodb:
    uri: ${MONGODB_URI:mongodb://admin:admin123@localhost:27017/resumeforge?authSource=admin}

gemini:
  api-key: ${GEMINI_API_KEY:}
  models: gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.6-flash,gemini-flash-lite-latest
  base-url: https://generativelanguage.googleapis.com/v1beta

ai:
  rate-limit:
    max-requests: 30
    window-minutes: 60

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiry-minutes: 60

auth:
  login:
    max-failures: 5
    window-minutes: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info